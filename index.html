<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="modalClose" aria-label="Close">

    </button>
    <div class="modal-img" id="modalImgWrap"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <span class="item-name" id="modalTitle"></span>
      <span class="item-desc" id="modalDesc"></span>
      <span class="item-price" id="modalPrice"></span>
    </div>
  </div>
</div>

<script>
(function () {
  // Builds the nav and every menu section from MENU_DATA (menu-data.js).
  // This runs first so the rest of this script (reveal-on-scroll, active
  // nav tracking, the item modal) sees the real DOM, same as if it had
  // been written out by hand.
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function buildImg(item) {
    var img = document.createElement('img');
    img.src = 'images/' + item.image;
    img.alt = item.alt || item.name;
    img.loading = item.eager ? 'eager' : 'lazy';
    img.decoding = 'async';
    return img;
  }

  function buildPrice(price) {
    return el('span', 'row-price item-price', price);
  }

  function buildRowItem(item) {
    var li = document.createElement('li');
    var btn = el('button', 'row-item item-btn' + (item.noPhoto ? ' no-photo' : ''));
    btn.type = 'button';
    if (!item.noPhoto) {
      var thumb = el('div', 'row-thumb');
      thumb.appendChild(buildImg(item));
      btn.appendChild(thumb);
    }
    var text = el('div', 'row-text');
    text.appendChild(el('h3', 'item-name', item.name));
    text.appendChild(el('p', 'item-desc', item.desc));
    btn.appendChild(text);
    btn.appendChild(buildPrice(item.price));
    li.appendChild(btn);
    return li;
  }

  function buildRowList(items) {
    var ul = el('ul', 'row-list reveal');
    items.forEach(function (item) { ul.appendChild(buildRowItem(item)); });
    return ul;
  }

  function buildTile(item, isGalleryItem) {
    var btn = el('button', isGalleryItem ? 'gallery-item tile item-btn' : 'tile item-btn');
    btn.type = 'button';
    var imgWrap = el('div', 'tile-img');
    imgWrap.appendChild(buildImg(item));
    btn.appendChild(imgWrap);
    if (item.eyebrow) { btn.appendChild(el('span', 'tile-eyebrow', item.eyebrow)); }
    btn.appendChild(el('h3', 'item-name', item.name));
    btn.appendChild(el('p', 'tile-desc item-desc', item.desc));
    btn.appendChild(buildPrice(item.price));
    return btn;
  }

  function buildTileGrid(items, extraClass) {
    var div = el('div', 'tile-grid reveal' + (extraClass ? ' ' + extraClass : ''));
    items.forEach(function (item) { div.appendChild(buildTile(item, false)); });
    return div;
  }

  function buildGalleryScroll(items) {
    var div = el('div', 'gallery-scroll reveal');
    items.forEach(function (item) { div.appendChild(buildTile(item, true)); });
    return div;
  }

  function buildTierRow(item) {
    var li = document.createElement('li');
    var btn = el('button', 'tier-row item-btn');
    btn.type = 'button';
    var top = el('div', 'tier-top');
    top.appendChild(el('span', 'tier-name item-name', item.name));
    top.appendChild(el('span', 'tier-fill'));
    top.appendChild(el('span', 'tier-price item-price', item.price));
    btn.appendChild(top);
    btn.appendChild(el('p', 'tier-desc item-desc', item.desc));
    li.appendChild(btn);
    return li;
  }

  function buildTierList(items, cols2) {
    var ul = el('ul', 'tier-list reveal' + (cols2 ? ' tier-list--cols-2' : ''));
    items.forEach(function (item) { ul.appendChild(buildTierRow(item)); });
    return ul;
  }

  function buildFeature(item) {
    var btn = el('button', 'feature reveal item-btn');
    btn.type = 'button';
    var imgWrap = el('div', 'feature-img');
    imgWrap.appendChild(buildImg(item));
    btn.appendChild(imgWrap);
    var body = el('div', 'feature-body');
    body.appendChild(el('span', 'kicker', item.kicker));
    body.appendChild(el('h3', 'item-name', item.name));
    body.appendChild(el('p', 'item-desc', item.desc));
    body.appendChild(buildPrice(item.price));
    btn.appendChild(body);
    return btn;
  }

  function buildHeading(text) {
    var div = el('div', 'section-head reveal');
    div.style.marginTop = 'var(--sp-6)';
    div.style.marginBottom = 'var(--sp-4)';
    div.appendChild(el('span', 'eyebrow', text));
    return div;
  }

  function buildSectionHead(section) {
    var div = el('div', 'section-head reveal');
    div.appendChild(el('span', 'eyebrow', section.number + ' — ' + section.title));
    div.appendChild(el('h2', null, section.title));
    div.appendChild(el('p', null, section.subtitle));
    return div;
  }

  function buildBlock(block) {
    switch (block.type) {
      case 'row-list': return buildRowList(block.items);
      case 'tile-grid': return buildTileGrid(block.items, block.extraClass);
      case 'gallery-scroll': return buildGalleryScroll(block.items);
      case 'tier-list': return buildTierList(block.items, block.cols2);
      case 'feature': return buildFeature(block.item);
      case 'heading': return buildHeading(block.text);
    }
  }

  function renderMenu() {
    var navWrap = document.getElementById('categoryNavLinks');
    var sectionsWrap = document.getElementById('menuSections');

    MENU_DATA.forEach(function (section) {
      var a = el('a', 'nav-link', section.navLabel || section.title);
      a.setAttribute('href', '#' + section.id);
      navWrap.appendChild(a);

      var sectionEl = document.createElement('section');
      sectionEl.className = 'menu-section';
      sectionEl.id = section.id;
      sectionEl.appendChild(buildSectionHead(section));
      section.blocks.forEach(function (block) {
        sectionEl.appendChild(buildBlock(block));
      });
      sectionsWrap.appendChild(sectionEl);
    });
  }

  renderMenu();

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Reveal-on-scroll — progressive enhancement only. Elements are fully
  // visible by default (see CSS); JS opts them into the animated starting
  // state, so a JS error or slow script never leaves content hidden.
  if (!reduceMotion && 'IntersectionObserver' in window) {
    var revealEls = document.querySelectorAll('.reveal');
    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach(function (el) {
      el.classList.add('pre-reveal');
      revealObserver.observe(el);
    });
  }

  // Active category tracking
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));
  var sections = navLinks
    .map(function (link) { return document.querySelector(link.getAttribute('href')); })
    .filter(Boolean);

  function setActive(id) {
    navLinks.forEach(function (link) {
      var isActive = link.getAttribute('href') === '#' + id;
      link.classList.toggle('is-active', isActive);
      if (isActive) {
        link.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
      }
    });
  }

  if ('IntersectionObserver' in window && sections.length) {
    var navHeight = document.getElementById('categoryNav').offsetHeight;
    var sectionObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { setActive(entry.target.id); }
      });
    }, { rootMargin: '-' + (navHeight + 10) + 'px 0px -70% 0px', threshold: 0 });
    sections.forEach(function (section) { sectionObserver.observe(section); });
  }

  // Item detail modal — tap any menu item to see its photo, description
  // and price larger. Reads content straight from the tapped item's own
  // markup, so there is a single source of truth for name/desc/price.
  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalImgWrap = document.getElementById('modalImgWrap');
  var modalImg = document.getElementById('modalImg');
  var modalTitle = document.getElementById('modalTitle');
  var modalDesc = document.getElementById('modalDesc');
  var modalPrice = document.getElementById('modalPrice');
  var modalClose = document.getElementById('modalClose');
  var lastFocused = null;
  var closeTimer = null;

  function openModal(btn) {
    var nameEl = btn.querySelector('.item-name');
    var descEl = btn.querySelector('.item-desc');
    var priceEl = btn.querySelector('.item-price');
    var imgEl = btn.querySelector('img');

    modalTitle.textContent = nameEl ? nameEl.textContent.trim() : '';
    modalDesc.textContent = descEl ? descEl.textContent.trim() : '';
    modalPrice.textContent = priceEl ? priceEl.textContent.trim() : '';

    if (imgEl) {
      modalImg.src = imgEl.currentSrc || imgEl.src;
      modalImg.alt = imgEl.alt || modalTitle.textContent;
      modalImgWrap.hidden = false;
    } else {
      modalImg.removeAttribute('src');
      modalImgWrap.hidden = true;
    }

    lastFocused = btn;
    window.clearTimeout(closeTimer);
    modalBackdrop.hidden = false;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () {
      modalBackdrop.classList.add('is-open');
    });
    modalClose.focus();
  }

  function closeModal() {
    modalBackdrop.classList.remove('is-open');
    document.body.style.overflow = '';
    window.clearTimeout(closeTimer);
    closeTimer = window.setTimeout(function () {
      modalBackdrop.hidden = true;
    }, reduceMotion ? 0 : 280);
    if (lastFocused) { lastFocused.focus(); }
  }

  document.querySelectorAll('.item-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { openModal(btn); });
  });

  modalClose.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', function (e) {
    if (e.target === modalBackdrop) { closeModal(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modalBackdrop.hidden) { closeModal(); }
  });
})();
</script>
